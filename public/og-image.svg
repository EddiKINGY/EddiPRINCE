<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="100%" stop-color="#181A20" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#262626" stroke-width="2" />
  
  <!-- Beacon Badge -->
  <g transform="translate(100, 110)">
    <rect width="220" height="40" rx="20" fill="#064E3B" stroke="#047857" stroke-width="1" />
    <circle cx="24" cy="20" r="6" fill="#10B981" />
    <text x="42" y="25" fill="#D1FAE5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="1">ZERO STATE ACTIVE</text>
  </g>

  <!-- Title -->
  <text x="100" y="270" fill="#FFFFFF" font-family="'Instrument Serif', Georgia, serif" font-size="92" font-weight="400" letter-spacing="-1">
    EddiPRINCE
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="340" fill="#9CA3AF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="400">
    Builder, systems thinker, and creator documenting the journey from zero.
  </text>

  <!-- Manifesto quote -->
  <text x="100" y="420" fill="#6EE7B7" font-family="'Instrument Serif', Georgia, serif" font-size="26" font-style="italic">
    "No synthetic prestige, no vanity metrics — compounding real work in public."
  </text>

  <!-- Footer metadata -->
  <g transform="translate(100, 500)">
    <text x="0" y="0" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="16">
      eddiprince.com • Software Architecture • Tatashi Market • Field Notes
    </text>
  </g>
</svg>
