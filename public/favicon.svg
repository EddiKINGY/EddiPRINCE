<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E0F12; }
      .border { stroke: #262626; }
      .text { fill: #E8E9ED; }
      .accent { fill: #10B981; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FBFBFA; }
      .border { stroke: #E5E5E5; }
      .text { fill: #191919; }
      .accent { fill: #059669; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="border" x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke-width="1" />
  <text class="text" x="7" y="21" font-family="'Instrument Serif', Georgia, serif" font-size="16" font-weight="600">E</text>
  <text class="text" x="17" y="21" font-family="'Instrument Serif', Georgia, serif" font-size="16" font-weight="400">P</text>
  <circle class="accent" cx="26" cy="19" r="1.5" />
</svg>
